<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Reviewer — Login</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --danger: #f85149;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .logo h1 { font-size: 22px; font-weight: 600; }
        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
            color: var(--text);
            font-family: var(--font);
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }
        .btn {
            width: 100%;
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font);
            transition: background 0.15s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error {
            display: none;
            color: var(--danger);
            font-size: 13px;
            margin-top: 12px;
            padding: 8px 12px;
            background: rgba(248, 81, 73, 0.1);
            border-radius: 6px;
        }
        .error.visible { display: block; }
        .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/>
            </svg>
            <h1>Agent Reviewer</h1>
        </div>
        <p class="subtitle">Enter your API key to access the review dashboard</p>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="apiKey">API Key</label>
                <input type="password" id="apiKey" placeholder="Enter your API key" required autocomplete="current-password">
            </div>
            <button class="btn" type="submit" id="loginBtn">Sign In</button>
        </form>

        <div class="error" id="errorMsg"></div>
        <p class="hint">The API key is set via the AGENT_REVIEWER_API_KEY environment variable on the server.</p>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('errorMsg');
            errEl.classList.remove('visible');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            const apiKey = document.getElementById('apiKey').value;

            try {
                const resp = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_key: apiKey }),
                });

                if (resp.ok) {
                    window.location.href = '/';
                } else {
                    const data = await resp.json();
                    errEl.textContent = data.error || 'Authentication failed';
                    errEl.classList.add('visible');
                }
            } catch (err) {
                errEl.textContent = 'Connection error: ' + err.message;
                errEl.classList.add('visible');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }
    </script>
</body>
</html>
